<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2A66"><meta name="robots" content="noindex"><title>FeePilot · School fees office</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{--bg:#F4F7FE;--card:#fff;--ink:#0B1B3A;--mut:#55657F;--line:#E3EAF8;--navy:#0B2A66;--p:#2158D6;--p2:#2F6FED;--pl:#E8EFFE;--gold:#F5B301;--goldl:#FFF4D6;--ok:#14A44D;--okl:#E3F6EA;--warn:#D97706;--warnl:#FEF1DC;--bad:#E5484D;--badl:#FDE9EA;--r:20px;--sh:0 1px 2px rgba(11,42,102,.05),0 8px 24px rgba(11,42,102,.07);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 40% at 0% 0%,#DCE7FF 0,transparent 70%),radial-gradient(50% 35% at 100% 100%,#FFF1CC 0,transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;color:var(--navy);letter-spacing:-.02em}
a{color:var(--p);font-weight:600;text-decoration:none}
.m{color:var(--mut);font-size:13px}.b{font-weight:700}.r{text-align:right}.c{text-align:center}
.neg{color:var(--bad)}.pos{color:var(--ok)}.nowrap{white-space:nowrap}
.hide{display:none!important}
/* shell */
#app{min-height:100vh}
#tb{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(244,247,254,.94);border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:11px;flex:none;background:linear-gradient(135deg,#0B2A66,#2F6FED);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;box-shadow:0 4px 10px rgba(33,88,214,.3)}
.sch{font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;color:var(--navy)}
.sp{flex:1}
.st{font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.st:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}.st.off:before{background:var(--warn)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy);flex:none;padding:0}
.ib svg{width:20px;height:20px}
.av{width:40px;height:40px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
main{max-width:1000px;margin:0 auto;padding:6px 14px 120px}
.ph{margin:14px 0 4px;font-size:26px}
.sub{color:var(--mut);font-size:13.5px;margin-bottom:10px}
/* nav */
#nav{position:fixed;z-index:40;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 32px rgba(11,42,102,.18);display:flex;align-items:flex-end;justify-content:space-around;padding:6px 6px 8px}
#nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;border-radius:18px;margin:0;min-width:0}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--p)}
#nav button.on svg{stroke-width:2.2}
#nav .fab{flex:none;width:62px;height:62px;border-radius:50%;margin-top:-26px;background:linear-gradient(135deg,#F5B301,#FFCB3D);color:var(--navy);box-shadow:0 10px 20px rgba(245,179,1,.45);border:4px solid var(--bg);justify-content:center;padding:0;gap:0}
#nav .fab svg{width:26px;height:26px;stroke-width:2.4}
#nav .fab span{font-size:10px;font-weight:800;line-height:1}
#nav .nb{display:none}
@media(min-width:900px){
 #nav{top:0;bottom:0;left:0;right:auto;width:240px;max-width:none;margin:0;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:16px 12px;overflow-y:auto;gap:2px}
 #nav .nb{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-weight:800;color:var(--navy);font-size:18px}
 #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 14px;border-radius:14px}
 #nav button.on{background:var(--pl)}
 #nav .fab{width:auto;height:auto;margin:6px 0;border-radius:14px;border:0;flex-direction:row;justify-content:center;padding:12px;box-shadow:0 6px 14px rgba(245,179,1,.4)}
 #nav .fab svg{width:20px;height:20px}#nav .fab span{font-size:14px}
 #nav .mob{display:none}
 #tb,main{margin-left:240px}#tb{padding-left:24px}
 main{padding-bottom:50px}
}
@media(max-width:899px){#nav .desk{display:none}}
/* cards & lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card>h3,.ct{font-size:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ct a{font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.row .t{flex:1;min-width:0}
.row .t b,.row .t .n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty .ei{font-size:34px;display:block;margin-bottom:6px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--pl);color:var(--p);white-space:nowrap}
.badge.ok{background:var(--okl);color:#0C7A38}.badge.warn{background:var(--warnl);color:var(--warn)}.badge.bad{background:var(--badl);color:#C23439}.badge.gold{background:var(--goldl);color:#9A6B00}.badge.mut{background:#EEF1F7;color:var(--mut)}
/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;border:1.5px solid transparent;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#3B7BF2,#2158D6);color:#fff;box-shadow:0 6px 16px rgba(33,88,214,.28);text-decoration:none;margin:0}
.btn:active{transform:scale(.98)}
.btn.blk{width:100%}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#FFCB3D,#F5B301);color:var(--navy);box-shadow:0 6px 16px rgba(245,179,1,.35)}
.btn.bad{background:#fff;color:var(--bad);border-color:#F5C2C4;box-shadow:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;min-width:130px}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.in,input.in,select.in,textarea.in{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0}
textarea.in{min-height:90px;resize:vertical}
.in:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(33,88,214,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}
.srch{position:relative}
.srch svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--mut)}
.srch input{padding-left:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;background:#EAF0FD;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(11,42,102,.12)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 10px;font-weight:700;cursor:pointer;color:var(--ink)}
.pick button.on{border-color:var(--p);background:var(--pl);color:var(--p)}
.fee{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;margin:6px 0;cursor:pointer}
.fee.on{border-color:var(--p);background:var(--pl)}
.fee .a{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.bar{height:8px;border-radius:99px;background:#E7EDFA;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2F6FED,#14A44D)}
/* combo */
.combo{position:relative}
.clist{position:absolute;left:0;right:0;top:100%;z-index:60;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(11,42,102,.2);max-height:300px;overflow-y:auto}
.clist .ci{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.clist .ci:last-child{border:0}.clist .ci:hover,.clist .ci.hl{background:var(--pl)}
.clist .ci .t{flex:1;min-width:0}.clist .ci b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* dashboard */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:#fff;margin:10px 0;background:radial-gradient(120% 140% at 100% 0%,#3E7BF0 0,transparent 60%),linear-gradient(135deg,#0B2A66,#1E4FC2);box-shadow:0 18px 40px rgba(11,42,102,.32)}
.hero .g{font-size:14px;opacity:.9}
.hero .lab{font-size:11.5px;letter-spacing:.14em;font-weight:700;opacity:.75;margin-top:8px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0}
.hero .sm2{opacity:.85;font-size:13.5px}
.hero svg.spk{position:absolute;right:14px;top:14px;width:42%;max-width:240px;height:64px;opacity:.95}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:12.5px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;padding:14px 8px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;padding:4px}
.qa i{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-style:normal;font-size:25px;box-shadow:0 8px 16px rgba(11,42,102,.14)}
.att{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line);margin:8px 0;background:#fff;cursor:pointer}
.att .ai{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.att .t{flex:1;min-width:0}.att .t b{display:block}
.att.warn{background:var(--warnl);border-color:#F6DDB4}.att.warn .ai{background:#fff}
.att.bad{background:var(--badl);border-color:#F5C9CB}.att.bad .ai{background:#fff}
.att.ok{background:var(--okl);border-color:#C5EBD2}.att.ok .ai{background:#fff}
.rings{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;text-align:center}
.rings .m{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-top:8px;border-radius:14px;background:#F5F8FF}
.grid-d{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:760px){.grid-d{grid-template-columns:1fr 1fr}}
.hb{margin:10px 0}.hb .hr{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.hb .bar{margin-top:5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.kpi .m{font-weight:600}.kpi b{font-size:18px;display:block;margin-top:2px}
/* sheet */
.ov{position:fixed;inset:0;z-index:80;background:rgba(11,27,58,.38);-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:su .22s ease-out;position:relative}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#D5DDEE;margin:6px auto 10px}
.sheet h2{font-size:20px;margin:6px 0 2px;padding-right:44px}
.sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:#EEF2FB;cursor:pointer;font-size:18px;color:var(--navy)}
.sheet.wide{max-width:680px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;max-height:88vh}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:120;max-width:min(92vw,460px);padding:12px 18px;border-radius:16px;color:#fff;font-weight:600;background:var(--navy);box-shadow:0 14px 34px rgba(11,42,102,.35);animation:su .2s}
.toast.ok{background:#0C7A38}.toast.bad{background:#C23439}
@media(min-width:900px){.toast{bottom:30px}}
/* receipt */
.rc{border:1.5px dashed #C9D5EE;border-radius:18px;padding:16px;background:#FCFDFF}
.rc .h{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px dashed #C9D5EE}
.rc .h img{max-height:48px;max-width:70px;border-radius:8px}
.rc .big{font-size:30px;font-weight:800;color:var(--navy);margin:6px 0 2px}
.rc .rv{background:var(--badl);color:#C23439;border-radius:12px;padding:8px 12px;font-weight:700;margin-top:10px;text-align:center}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}
.kv span:first-child{color:var(--mut)}.kv span:last-child{font-weight:600;text-align:right}
/* table */
.tw{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;padding:8px 6px;color:var(--mut);font-weight:700;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.t tr.tot td{font-weight:800;border-top:2px solid var(--navy)}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
/* auth */
.auth{max-width:420px;margin:0 auto;padding:30px 16px 40px}
.auth .logo{width:64px;height:64px;font-size:34px;border-radius:20px;margin:30px auto 12px}
.auth h1{text-align:center;font-size:28px}
.auth .tag{text-align:center;color:var(--mut);margin:4px 0 18px;font-size:14px}
.auth .back{text-align:center;margin-top:16px;font-size:14px}
.err{color:#C23439;font-size:13.5px;font-weight:600;margin-top:10px}
.demo{background:var(--goldl);color:#7A5600;text-align:center;font-size:13px;font-weight:700;padding:7px 10px}
.sync{background:var(--warnl);color:var(--warn);border-radius:14px;padding:10px 14px;font-weight:600;font-size:13.5px;margin:10px 0}
@media print{body:before,#tb,#nav,.np,.demo,.toast{display:none!important}body{background:#fff}.ov{position:static;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;display:block}.sheet{box-shadow:none;max-height:none;padding:0;max-width:none;animation:none}.sheet .x,.sheet .grab{display:none}main,#tb{margin:0!important;padding:0}.card{box-shadow:none}}
@media print{body:has(.ov) #app{display:none!important}.ov{position:static!important;display:block!important}@page{margin:12mm}}
</style></head><body>
<div id="app"><div style="padding:60px 20px;text-align:center;color:#55657F;font:15px system-ui">Loading FeePilot…</div></div>

<script>
if(!window.crypto)window.crypto={};
if(!crypto.randomUUID)crypto.randomUUID=function(){var b=new Uint8Array(16);if(crypto.getRandomValues)crypto.getRandomValues(b);else for(var i=0;i<16;i++)b[i]=Math.random()*256;b[6]=b[6]&15|64;b[8]=b[8]&63|128;var h=Array.prototype.map.call(b,function(x){return(x+256).toString(16).slice(1)}).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)};
</script>
